<svg xmlns='http://www.w3.org/2000/svg' width='940' height='470' viewBox='0 0 940 470'><defs><marker id='arrow' markerWidth='9' markerHeight='9' refX='7' refY='3' orient='auto' markerUnits='strokeWidth'><path d='M0,0 L7,3 L0,6 z' fill='#6b6b6b'/></marker></defs><text x='20' y='30' font-family='Helvetica,Arial,sans-serif' font-size='16' fill='#1b1b1b' text-anchor='start' font-weight='bold' font-style='normal'>Three-way review decision under controlled evidence</text><rect x='20' y='55' width='285' height='52' rx='4' fill='#ffffff' stroke='#3b8a52' stroke-width='1.6'/><text x='32' y='78' font-family='Helvetica,Arial,sans-serif' font-size='14' fill='#3b8a52' text-anchor='start' font-weight='bold' font-style='normal'>ACCEPT</text><text x='32' y='98' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='start' font-weight='normal' font-style='italic'>patch acceptable under the granted scope</text><rect x='320' y='55' width='285' height='52' rx='4' fill='#ffffff' stroke='#b63b3b' stroke-width='1.6'/><text x='332' y='78' font-family='Helvetica,Arial,sans-serif' font-size='14' fill='#b63b3b' text-anchor='start' font-weight='bold' font-style='normal'>REJECT</text><text x='332' y='98' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='start' font-weight='normal' font-style='italic'>a decisive failure is evidenced</text><rect x='620' y='55' width='285' height='52' rx='4' fill='#ffffff' stroke='#3b6fb6' stroke-width='1.6'/><text x='632' y='78' font-family='Helvetica,Arial,sans-serif' font-size='14' fill='#3b6fb6' text-anchor='start' font-weight='bold' font-style='normal'>NEED_EVIDENCE</text><text x='632' y='98' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='start' font-weight='normal' font-style='italic'>available evidence is non-decisive</text><rect x='20' y='140' width='440' height='150' rx='4' fill='#f7f9fc' stroke='#3b6fb6' stroke-width='1.2'/><text x='34' y='164' font-family='Helvetica,Arial,sans-serif' font-size='14' fill='#3b6fb6' text-anchor='start' font-weight='bold' font-style='normal'>Oracle Gold</text><text x='34' y='186' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>ground truth from real pytest: F2P / P2P / symptom</text><text x='34' y='206' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>ACCEPT if declared tests pass &amp; no in-scope regression;</text><text x='34' y='224' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>REJECT on any decisive declared failure.</text><text x='34' y='252' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='normal' font-style='italic'>Scoped, not whole-project correctness.</text><rect x='480' y='140' width='440' height='150' rx='4' fill='#fcf8f6' stroke='#b63b3b' stroke-width='1.2'/><text x='494' y='164' font-family='Helvetica,Arial,sans-serif' font-size='14' fill='#b63b3b' text-anchor='start' font-weight='bold' font-style='normal'>Condition Gold</text><text x='494' y='186' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>the decision the granted evidence can justify:</text><text x='494' y='206' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>restricted surfaces -&gt; NEED_EVIDENCE even when</text><text x='494' y='224' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#1b1b1b' text-anchor='start' font-weight='normal' font-style='normal'>oracle is ACCEPT/REJECT; sufficient -&gt; oracle.</text><text x='494' y='252' font-family='Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b6b6b' text-anchor='start' font-weight='normal' font-style='italic'>Distinguishes integrity from sufficiency.</text><text x='20' y='324' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='start' font-weight='bold' font-style='normal'>Evidence conditions (per issue)</text><rect x='20' y='340' width='172' height='86' rx='4' fill='#fff' stroke='#b63b3b' stroke-width='1.2'/><text x='106' y='366' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='bold' font-style='normal'>T2D-T</text><text x='106' y='388' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='normal' font-style='normal'>static restricted</text><text x='106' y='410' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#b63b3b' text-anchor='middle' font-weight='normal' font-style='italic'>gold: NEED</text><line x1='192' y1='383' x2='208' y2='383' stroke='#6b6b6b' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='204' y='340' width='172' height='86' rx='4' fill='#fff' stroke='#b63b3b' stroke-width='1.2'/><text x='290' y='366' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='bold' font-style='normal'>T3D-Strict</text><text x='290' y='388' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='normal' font-style='normal'>active, outcomes withheld</text><text x='290' y='410' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#b63b3b' text-anchor='middle' font-weight='normal' font-style='italic'>gold: NEED</text><line x1='376' y1='383' x2='392' y2='383' stroke='#6b6b6b' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='388' y='340' width='172' height='86' rx='4' fill='#fff' stroke='#3b8a52' stroke-width='1.2'/><text x='474' y='366' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='bold' font-style='normal'>T3D-Escalate</text><text x='474' y='388' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='normal' font-style='normal'>active, then outcomes granted</text><text x='474' y='410' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#3b8a52' text-anchor='middle' font-weight='normal' font-style='italic'>gold: = oracle</text><line x1='560' y1='383' x2='576' y2='383' stroke='#6b6b6b' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='572' y='340' width='172' height='86' rx='4' fill='#fff' stroke='#3b8a52' stroke-width='1.2'/><text x='658' y='366' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='bold' font-style='normal'>T2A-T</text><text x='658' y='388' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='normal' font-style='normal'>static sufficient (tier-A)</text><text x='658' y='410' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#3b8a52' text-anchor='middle' font-weight='normal' font-style='italic'>gold: = oracle</text><line x1='744' y1='383' x2='760' y2='383' stroke='#6b6b6b' stroke-width='1.5' marker-end='url(#arrow)'/><rect x='756' y='340' width='172' height='86' rx='4' fill='#fff' stroke='#3b8a52' stroke-width='1.2'/><text x='842' y='366' font-family='Helvetica,Arial,sans-serif' font-size='13' fill='#1b1b1b' text-anchor='middle' font-weight='bold' font-style='normal'>T3A-T</text><text x='842' y='388' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b6b6b' text-anchor='middle' font-weight='normal' font-style='normal'>active sufficient (tier-A)</text><text x='842' y='410' font-family='Helvetica,Arial,sans-serif' font-size='10.5' fill='#3b8a52' text-anchor='middle' font-weight='normal' font-style='italic'>gold: = oracle</text><line x1='928' y1='383' x2='944' y2='383' stroke='#6b6b6b' stroke-width='1.5' marker-end='url(#arrow)'/></svg>